<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Baynana</title>
<style>
  body{max-width:760px;margin:0 auto;padding:40px 20px;color:#2D2A32;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.65}
  h1,h2,h3{line-height:1.25;color:#5B3A4A}
  a{color:#C97B84}
  table{border-collapse:collapse;width:100%;margin:1em 0}
  th,td{border:1px solid #EDE4DD;padding:6px 10px;text-align:start}
  hr{border:none;border-top:1px solid #EDE4DD;margin:2em 0}
  code{background:#F5EEE7;padding:2px 5px;border-radius:4px}
  blockquote{border-inline-start:3px solid #EDE4DD;margin:0;padding-inline-start:1em;color:#8A8589}
  .nav{font-size:.9em;margin-bottom:2em}
</style>
</head>
<body>
<div class="nav"><a href="{{ '/' | relative_url }}">← All documents</a></div>
{{ content }}
</body>
</html>
